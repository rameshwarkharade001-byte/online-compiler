<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeForge - Ultra Multi-Language IDE & Compiler</title>
    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Ace Editor -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ext-language_tools.js"></script>

    <style>
        :root {
            --bg-base: #090a0f;
            --bg-surface: #11131a;
            --bg-elevated: #181a24;
            --border: #242736;
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.25);
            --success: #10b981;
            --success-hover: #059669;
            --danger: #ef4444;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar */
        header {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .logo i {
            color: #818cf8;
            font-size: 1.3rem;
            filter: drop-shadow(0 0 8px var(--primary-glow));
        }

        .action-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        select {
            background: var(--bg-elevated);
            color: #fff;
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        .icon-btn {
            background: var(--bg-elevated);
            color: var(--text-secondary);
            border: 1px solid var(--border);
            padding: 7px 11px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.88rem;
        }

        .icon-btn:hover {
            color: #fff;
            border-color: #3b4256;
        }

        .btn-run {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 7px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
            transition: all 0.2s;
        }

        .btn-run:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 18px rgba(16, 185, 129, 0.4);
        }

        .btn-run:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Responsive Layout */
        .workspace {
            flex: 1;
            display: grid;
            grid-template-columns: 1.3fr 1fr;
            overflow: hidden;
        }

        @media (max-width: 820px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
        }

        /* Editor Section */
        .panel {
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
            position: relative;
            background: #0d0e14;
        }

        .panel-header {
            background: var(--bg-surface);
            padding: 8px 16px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        #editor {
            flex: 1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 14px;
        }

        /* Right Panel: STDIN + Console */
        .right-panel {
            display: flex;
            flex-direction: column;
            background: #0b0c11;
        }

        #customInput {
            height: 85px;
            background: var(--bg-surface);
            border: none;
            border-bottom: 1px solid var(--border);
            padding: 10px 14px;
            color: #cbd5e1;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
        }

        #outputBox {
            flex: 1;
            padding: 14px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            color: #38bdf8;
            overflow-y: auto;
            white-space: pre-wrap;
            background: #08090d;
        }

        .badge {
            background: #212638;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            color: #94a3b8;
        }

        .status-pill {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #10b981;
        }

        /* Ad Banner Placeholder */
        .ad-banner {
            background: #0c0d12;
            border-top: 1px dashed #242736;
            padding: 6px;
            font-size: 0.72rem;
            text-align: center;
            color: #64748b;
        }

        .error-text {
            color: #f87171 !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-bolt-lightning"></i> CodeForge IDE
        </div>

        <div class="action-bar">
            <!-- 20+ Languages Dropdown -->
            <select id="langSelect">
                <option value="python">Python 3 (3.8.1)</option>
                <option value="cpp">C++ (GCC 9.2.0)</option>
                <option value="c">C (GCC 9.2.0)</option>
                <option value="java">Java (OpenJDK 13)</option>
                <option value="javascript">JavaScript (Node.js 12)</option>
                <option value="typescript">TypeScript (3.7.4)</option>
                <option value="csharp">C# (Mono 6.6.0)</option>
                <option value="go">Go (1.13.5)</option>
                <option value="rust">Rust (1.40.0)</option>
                <option value="php">PHP (7.4.1)</option>
                <option value="kotlin">Kotlin (1.3.70)</option>
                <option value="swift">Swift (5.2.3)</option>
                <option value="ruby">Ruby (2.7.0)</option>
                <option value="r">R Language (4.0.0)</option>
                <option value="dart">Dart (2.19.6)</option>
                <option value="scala">Scala (2.13.2)</option>
                <option value="bash">Bash Script (5.0.0)</option>
                <option value="perl">Perl (5.30.0)</option>
                <option value="lua">Lua (5.3.5)</option>
                <option value="haskell">Haskell (GHC 8.8.3)</option>
            </select>

            <button class="icon-btn" onclick="adjustFontSize(1)" title="Zoom In"><i class="fa-solid fa-plus"></i></button>
            <button class="icon-btn" onclick="adjustFontSize(-1)" title="Zoom Out"><i class="fa-solid fa-minus"></i></button>
            <button class="icon-btn" onclick="copyCode()" title="Copy Code"><i class="fa-regular fa-copy"></i></button>
            <button class="icon-btn" onclick="clearConsole()" title="Clear Terminal"><i class="fa-solid fa-trash-can"></i></button>

            <button id="runBtn" class="btn-run" onclick="runCode()">
                <i class="fa-solid fa-play"></i> Run Code
            </button>
        </div>
    </header>

    <div class="workspace">
        <!-- Editor Panel -->
        <div class="panel">
            <div class="panel-header">
                <span id="currentLangBadge">PYTHON 3</span>
                <span class="badge">VS Code Engine</span>
            </div>
            <div id="editor"></div>
        </div>

        <!-- STDIN & Output Terminal -->
        <div class="right-panel">
            <div class="panel-header">
                <span>Program Input (STDIN)</span>
                <span class="badge">Optional</span>
            </div>
            <textarea id="customInput" placeholder="Enter input here if your program uses cin, input(), scanner..."></textarea>

            <div class="panel-header">
                <div class="status-pill">
                    <div class="dot" id="statusDot"></div>
                    <span id="statusText">Ready</span>
                </div>
                <span class="badge">Execution Output</span>
            </div>
            <pre id="outputBox">Click "Run Code" to compile and view execution output...</pre>
        </div>
    </div>

    <!-- Monetization Banner Slot -->
    <div class="ad-banner">
        <span>ADVERTISEMENT SPACE • READY FOR GOOGLE ADSENSE</span>
    </div>

    <script>
        const languages = {
            python: { id: 71, mode: "ace/mode/python", code: `# Python 3 Algorithm Example\ndef fib(n):\n    a, b = 0, 1\n    for _ in range(n):\n        yield a\n        a, b = b, a + b\n\nprint("Fibonacci Sequence:", list(fib(10)))\n` },
            cpp: { id: 54, mode: "ace/mode/c_cpp", code: `#include <iostream>\n#include <vector>\nusing namespace std;\n\nint main() {\n    vector<int> nums = {1, 2, 3, 4, 5};\n    cout << "C++ Engine Running Smoothly!" << endl;\n    for(int n : nums) cout << n * 2 << " ";\n    return 0;\n}\n` },
            c: { id: 50, mode: "ace/mode/c_cpp", code: `#include <stdio.h>\n\nint main() {\n    printf("Standard C System Initialized!\\n");\n    return 0;\n}\n` },
            java: { id: 62, mode: "ace/mode/java", code: `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Java 13 Virtual Machine Active!");\n    }\n}\n` },
            javascript: { id: 63, mode: "ace/mode/javascript", code: `const users = [{id: 1, name: "Alpha"}, {id: 2, name: "Beta"}];\nconsole.log("JavaScript Execution:", users.map(u => u.name));\n` },
            typescript: { id: 74, mode: "ace/mode/typescript", code: `interface Item { name: string; price: number; }\nconst laptop: Item = { name: "Pro Laptop", price: 1200 };\nconsole.log("TypeScript Typed Data:", laptop);\n` },
            csharp: { id: 51, mode: "ace/mode/csharp", code: `using System;\nclass MainClass {\n    public static void Main (string[] args) {\n        Console.WriteLine ("Hello from C# on Linux Container!");\n    }\n}\n` },
            go: { id: 60, mode: "ace/mode/golang", code: `package main\nimport "fmt"\n\nfunc main() {\n    fmt.Println("High Performance Go Runtime Active!")\n}\n` },
            rust: { id: 73, mode: "ace/mode/rust", code: `fn main() {\n    let msg = "Safe & Blazing Fast Rust!";\n    println!("{}", msg);\n}\n` },
            php: { id: 68, mode: "ace/mode/php", code: `<?php\n$arr = ["Code", "Compile", "Earn"];\necho implode(" -> ", $arr);\n` },
            kotlin: { id: 78, mode: "ace/mode/kotlin", code: `fun main() {\n    println("Kotlin Execution Environment Ready!")\n}\n` },
            swift: { id: 83, mode: "ace/mode/swift", code: `print("Swift Runtime Operational!")\n` },
            ruby: { id: 72, mode: "ace/mode/ruby", code: `3.times { puts "Ruby Online!" }\n` },
            r: { id: 80, mode: "ace/mode/r", code: `v <- c(10, 20, 30)\nprint(mean(v))\n` },
            dart: { id: 90, mode: "ace/mode/dart", code: `void main() {\n  print('Dart runtime ready for Flutter logic!');\n}\n` },
            scala: { id: 81, mode: "ace/mode/scala", code: `object Main extends App {\n  println("Scala Object Initialized!")\n}\n` },
            bash: { id: 46, mode: "ace/mode/sh", code: `echo "Operating System: $(uname -a)"\n` },
            perl: { id: 85, mode: "ace/mode/perl", code: `print "Perl script executed successfully!\\n";\n` },
            lua: { id: 64, mode: "ace/mode/lua", code: `print("Lua interpreter active!")\n` },
            haskell: { id: 61, mode: "ace/mode/haskell", code: `main = putStrLn "Pure Functional Haskell!"\n` }
        };

        // Editor Setup
        const editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/python");
        editor.setValue(languages.python.code, 1);
        editor.setOptions({
            enableBasicAutocompletion: true,
            enableLiveAutocompletion: true,
            showPrintMargin: false,
            fontSize: "14px"
        });

        const langSelect = document.getElementById("langSelect");
        const currentLangBadge = document.getElementById("currentLangBadge");
        const outputBox = document.getElementById("outputBox");
        const runBtn = document.getElementById("runBtn");
        const statusText = document.getElementById("statusText");
        const statusDot = document.getElementById("statusDot");

        langSelect.addEventListener("change", () => {
            const lang = languages[langSelect.value];
            if (lang) {
                editor.session.setMode(lang.mode);
                editor.setValue(lang.code, 1);
                currentLangBadge.innerText = langSelect.options[langSelect.selectedIndex].text.toUpperCase();
            }
        });

        let currentFontSize = 14;
        function adjustFontSize(delta) {
            currentFontSize = Math.max(10, Math.min(24, currentFontSize + delta));
            editor.setFontSize(currentFontSize + "px");
        }

        function copyCode() {
            navigator.clipboard.writeText(editor.getValue());
            alert("Code copied to clipboard!");
        }

        function clearConsole() {
            outputBox.innerText = "Console cleared.";
            outputBox.classList.remove("error-text");
            statusText.innerText = "Ready";
            statusDot.style.background = "#10b981";
        }

        async function runCode() {
            const currentLang = languages[langSelect.value];
            const code = editor.getValue();
            const stdin = document.getElementById("customInput").value;

            runBtn.disabled = true;
            runBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Running...';
            statusText.innerText = "Executing...";
            statusDot.style.background = "#eab308";
            outputBox.classList.remove("error-text");
            outputBox.innerText = "Compiling and running code...";

            try {
                const res = await fetch("https://ce.judge0.com/submissions?base64_encoded=false&wait=true", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        language_id: currentLang.id,
                        source_code: code,
                        stdin: stdin
                    })
                });

                const data = await res.json();

                if (data.stdout) {
                    outputBox.innerText = data.stdout;
                    statusText.innerText = "Success (200)";
                    statusDot.style.background = "#10b981";
                } else if (data.stderr) {
                    outputBox.classList.add("error-text");
                    outputBox.innerText = data.stderr;
                    statusText.innerText = "Runtime Error";
                    statusDot.style.background = "#ef4444";
                } else if (data.compile_output) {
                    outputBox.classList.add("error-text");
                    outputBox.innerText = data.compile_output;
                    statusText.innerText = "Compile Error";
                    statusDot.style.background = "#ef4444";
                } else {
                    outputBox.innerText = data.status ? data.status.description : "Completed";
                    statusText.innerText = "Done";
                    statusDot.style.background = "#10b981";
                }
            } catch (err) {
                outputBox.classList.add("error-text");
                outputBox.innerText = "Execution failed: " + err.message;
                statusText.innerText = "Network Error";
                statusDot.style.background = "#ef4444";
            } finally {
                runBtn.disabled = false;
                runBtn.innerHTML = '<i class="fa-solid fa-play"></i> Run Code';
            }
        }
    </script>
</body>
</html>
