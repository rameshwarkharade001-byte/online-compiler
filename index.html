        #top-ad-zone {

        /* Editor Section */
        .editor-wrapper {

        /* Bottom Command & Run Bar */

        .stdin-box {
            flex: 1;
            background: #141c2e;
            border: 1px solid #283550;
            border-radius: 10px;
            padding: 7px 12px;

            gap: 8px;

        .stdin-box input {

            border: none;

            outline: none;
        }

        .btn-run-code {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.92rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 7px;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4);
            white-space: nowrap;
            transition: transform 0.15s ease;
        }

        .btn-run-code:active {
            transform: scale(0.95);
        }

        /* Fullscreen Output Overlay */
        #outputOverlay {
            position: fixed;
            inset: 0;
            background: #060911;
            z-index: 999999;
            display: none;
            flex-direction: column;
        }

        .overlay-nav {
            background: #0f1627;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .console-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 0.95rem;
            color: #10b981;
        }

        .btn-back-editor {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.88rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 2px 10px rgba(239, 68, 68, 0.35);
        }

        .output-content-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .console-terminal {
            background: #0c101a;
            border: 1px solid #1e2638;
            border-radius: 10px;
            padding: 14px;
            min-height: 160px;
        }

        .console-header-line {
            display: flex;
            justify-content: space-between;
            color: #64748b;
            font-size: 0.75rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        #terminalOutput {
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #38bdf8;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .sponsored-ad-box {
            background: #0b0f19;
            border: 1px dashed #242f45;

</head>
<body>

    <!-- Header Section -->
    <header>
        <div class="logo-tag">
            <i class="fa-solid fa-cube"></i> CodeForge
        </div>

        <div class="controls-group">
            <select id="langSelect" class="lang-dropdown">
                <option value="python">Python 3</option>
                <option value="cpp">C++ (GCC)</option>
                <option value="c">C (GCC)</option>
                <option value="java">Java 13</option>
                <option value="javascript">JavaScript</option>
                <option value="csharp">C# (Mono)</option>
                <option value="go">Go (1.13)</option>
                <option value="rust">Rust</option>
                <option value="php">PHP</option>
                <option value="kotlin">Kotlin</option>
            </select>

            <button class="tool-btn" onclick="adjustFontSize(1)" title="Zoom In"><i class="fa-solid fa-plus"></i></button>
            <button class="tool-btn" onclick="adjustFontSize(-1)" title="Zoom Out"><i class="fa-solid fa-minus"></i></button>
            <button class="tool-btn" onclick="copySourceCode()" title="Copy Code"><i class="fa-regular fa-copy"></i></button>
        </div>
    </header>

    <!-- Top Banner Ad (320x50 Adsterra) -->
    <div id="top-ad-zone">
        <script type="text/javascript">
            atOptions = {
                'key' : 'e2fb0481067ecb77e9c1a9e148e65c71',
                'format' : 'iframe',
                'height' : 50,
                'width' : 320,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://www.highrevenueformat.com/e2fb0481067ecb77e9c1a9e148e65c71/invoke.js"></script>
    </div>

    <!-- Code Editor Section (Full Screen) -->
    <div class="editor-wrapper">
        <div class="tab-indicator-bar">
            <span id="currentLangTitle">MAIN.PY</span>
            <span class="engine-pill">CLOUD ENGINE</span>
        </div>
        <div id="editor-container">
            <div id="editor"></div>
        </div>
    </div>

    <!-- Bottom Mobile Toolbar with Giant Run Button -->
    <div class="bottom-action-bar">
        <div class="stdin-box">
            <i class="fa-solid fa-terminal"></i>
            <input type="text" id="stdinInput" placeholder="STDIN (Program input)...">
        </div>
        <button id="runBtn" class="btn-run-code" onclick="executeProgram()">
            <i class="fa-solid fa-play"></i> RUN
        </button>
    </div>

    <!-- Fullscreen Output Terminal Overlay -->
    <div id="outputOverlay">
        <div class="overlay-nav">
            <div class="console-badge">
                <i class="fa-solid fa-terminal"></i> Execution Result
            </div>
            <button class="btn-back-editor" onclick="closeTerminal()">
                <i class="fa-solid fa-arrow-left"></i> Back to Code
            </button>
        </div>

        <div class="output-content-area">
            <div class="console-terminal">
                <div class="console-header-line">
                    <span id="terminalStatusMsg">Status: Done</span>
                    <span id="execDuration">Time: 0.0s</span>
                </div>
                <pre id="terminalOutput">Processing output...</pre>
            </div>

            <!-- Adsterra Native Banner Ad -->
            <div class="sponsored-ad-box">
                <div style="font-size: 10px; color: #64748b; margin-bottom: 6px;">SPONSORED</div>
                <script async="async" data-cfasync="false" src="https://pl20790894.profitableratecpmnetwork.com/aa092d5a405faa2160549129cab4e19a/invoke.js"></script>
                <div id="container-aa092d5a405faa2160549129cab4e19a"></div>
            </div>
        </div>
    </div>

    <!-- Adsterra Social Bar Ad -->
    <script src="https://pl20790893.profitableratecpmnetwork.com/e0/d9/e1/e0d9e140d2a95360f9f664cd9cdffcc54.js"></script>

    <script>
        const languages = {
            python: { id: 71, mode: "ace/mode/python", ext: "MAIN.PY", code: `# Python 3 Online Demo\nprint("Hello World!")\nfor i in range(1, 6):\n    print(f"Step {i}: Success!")\n` },
            cpp: { id: 54, mode: "ace/mode/c_cpp", ext: "MAIN.CPP", code: `#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "C++ Output Ready!" << endl;\n    return 0;\n}\n` },
            c: { id: 50, mode: "ace/mode/c_cpp", ext: "MAIN.C", code: `#include <stdio.h>\n\nint main() {\n    printf("Standard C Output!\\n");\n    return 0;\n}\n` },
            java: { id: 62, mode: "ace/mode/java", ext: "MAIN.JAVA", code: `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Java Environment Active!");\n    }\n}\n` },
            javascript: { id: 63, mode: "ace/mode/javascript", ext: "MAIN.JS", code: `console.log("JavaScript Execution Finished!");\n` },
            csharp: { id: 51, mode: "ace/mode/csharp", ext: "PROGRAM.CS", code: `using System;\nclass MainClass {\n    static void Main() {\n        Console.WriteLine("C# Active!");\n    }\n}\n` },
            go: { id: 60, mode: "ace/mode/golang", ext: "MAIN.GO", code: `package main\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Go Runtime Active!");\n}\n` },
            rust: { id: 73, mode: "ace/mode/rust", ext: "MAIN.RS", code: `fn main() {\n    println!("Rust Active!");\n}\n` },
            php: { id: 68, mode: "ace/mode/php", ext: "INDEX.PHP", code: `<?php echo "PHP Active!\\n"; ?>\n` },
            kotlin: { id: 78, mode: "ace/mode/kotlin", ext: "MAIN.KT", code: `fun main() {\n    println("Kotlin Active!");\n}\n` }
        };

        const editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/python");
        editor.setValue(languages.python.code, 1);
        editor.setShowPrintMargin(false);

        // Auto resize to fit screen perfectly
        window.addEventListener('resize', () => editor.resize());
        setTimeout(() => editor.resize(), 200);

        const langSelect = document.getElementById("langSelect");
        const currentLangTitle = document.getElementById("currentLangTitle");
        const outputOverlay = document.getElementById("outputOverlay");
        const terminalOutput = document.getElementById("terminalOutput");
        const terminalStatusMsg = document.getElementById("terminalStatusMsg");
        const execDuration = document.getElementById("execDuration");

        langSelect.addEventListener("change", () => {
            const lang = languages[langSelect.value];
            if (lang) {
                editor.session.setMode(lang.mode);
                editor.setValue(lang.code, 1);
                currentLangTitle.innerText = lang.ext;
            }
        });

        let currentFontSize = 14.5;
        function adjustFontSize(delta) {
            currentFontSize = Math.max(12, Math.min(22, currentFontSize + delta));
            editor.setFontSize(currentFontSize + "px");
        }

        function copySourceCode() {
            navigator.clipboard.writeText(editor.getValue());
            alert("Code Copied!");
        }

        function closeTerminal() {
            outputOverlay.style.display = "none";
            setTimeout(() => editor.resize(), 100);
        }

        async function executeProgram() {
            const currentLang = languages[langSelect.value];
            const code = editor.getValue();
            const stdin = document.getElementById("stdinInput").value;

            outputOverlay.style.display = "flex";
            terminalOutput.style.color = "#38bdf8";
            terminalOutput.innerText = "Connecting to compiler cluster...\nExecuting code...\n";
            terminalStatusMsg.innerText = "Status: Running...";
            execDuration.innerText = "Time: ...";

            const startTime = performance.now();

            try {
                const res = await fetch("https://ce.judge0.com/submissions?base64_encoded=false&wait=true", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        language_id: currentLang.id,
                        source_code: code,
                        stdin: stdin
                    })
                });

                const data = await res.json();
                const totalTime = ((performance.now() - startTime) / 1000).toFixed(2);
                execDuration.innerText = `Time: ${totalTime}s`;

                if (data.stdout) {
                    terminalOutput.style.color = "#38bdf8";
                    terminalOutput.innerText = data.stdout;
                    terminalStatusMsg.innerText = "Status: Success (0)";
                } else if (data.stderr) {
                    terminalOutput.style.color = "#f87171";
                    terminalOutput.innerText = data.stderr;
                    terminalStatusMsg.innerText = "Status: Runtime Error";
                } else if (data.compile_output) {
                    terminalOutput.style.color = "#f87171";
                    terminalOutput.innerText = data.compile_output;
                    terminalStatusMsg.innerText = "Status: Compilation Error";
                } else {
                    terminalOutput.innerText = data.status ? data.status.description : "Completed";
                    terminalStatusMsg.innerText = "Status: Complete";
                }
            } catch (err) {
                terminalOutput.style.color = "#f87171";
                terminalOutput.innerText = "Network Error: " + err.message;
                terminalStatusMsg.innerText = "Status: Failed";
            }
        }
    </script>
</body>
</html>
