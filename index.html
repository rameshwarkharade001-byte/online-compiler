<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeForge Studio - Online Compiler</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ext-language_tools.js"></script>

    <style>
        :root {
            --bg-body: #06080e;
            --bg-card: #0d111c;
            --border: #1e2638;
            --primary: #6366f1;
            --run-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --text-main: #f8fafc;
            --text-muted: #8492a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: rgba(13, 17, 28, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 10px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.15rem;
            font-weight: 800;
        }

        .brand i {
            color: #818cf8;
            font-size: 1.25rem;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        select {
            background: #141a29;
            color: #fff;
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-family: inherit;
            cursor: pointer;
            outline: none;
        }

        .btn-action {
            background: #141a29;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 7px 11px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.88rem;
        }

        .btn-run {
            background: var(--run-gradient);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
        }

        /* 320x50 Banner Slot */
        #top-ad-zone {
            background: #090c14;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 52px;
            border-bottom: 1px solid var(--border);
            overflow: hidden;
        }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .editor-header {
            background: #0b0f19;
            padding: 7px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .badge-pill {
            background: #192033;
            color: #818cf8;
            padding: 2px 8px;
            border-radius: 5px;
            font-size: 0.72rem;
        }

        #editor {
            flex: 1;
            width: 100%;
            height: 100%;
            font-family: 'Fira Code', monospace;
            font-size: 14.5px;
        }

        .stdin-drawer {
            background: #0b0f19;
            border-top: 1px solid var(--border);
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stdin-drawer input {
            flex: 1;
            background: #141a29;
            border: 1px solid var(--border);
            padding: 7px 12px;
            border-radius: 6px;
            color: #fff;
            font-family: 'Fira Code', monospace;
            font-size: 13px;
            outline: none;
        }

        /* Output Modal Terminal */
        #outputOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 6, 12, 0.96);
            backdrop-filter: blur(14px);
            z-index: 9999;
            display: none;
            flex-direction: column;
        }

        .overlay-header {
            background: #0d121f;
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .overlay-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            font-weight: 700;
        }

        .btn-close-terminal {
            background: #ef4444;
            color: #fff;
            border: none;
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.82rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .overlay-ad-slot {
            background: #07090f;
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .terminal-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #04060a;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            line-height: 1.6;
            color: #38bdf8;
            white-space: pre-wrap;
        }

        .terminal-status-bar {
            background: #0d121f;
            border-top: 1px solid var(--border);
            padding: 8px 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .status-badge-ok { color: #10b981; font-weight: 600; }
        .status-badge-err { color: #ef4444; font-weight: 600; }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header>
        <div class="brand">
            <i class="fa-solid fa-code"></i> CodeForge Studio
        </div>

        <div class="nav-actions">
            <select id="langSelect">
                <option value="python">Python 3 (3.8.1)</option>
                <option value="cpp">C++ (GCC 9.2)</option>
                <option value="c">C (GCC 9.2)</option>
                <option value="java">Java (OpenJDK 13)</option>
                <option value="javascript">JavaScript (Node.js)</option>
                <option value="csharp">C# (Mono)</option>
                <option value="go">Go (1.13)</option>
                <option value="rust">Rust (1.40)</option>
                <option value="php">PHP (7.4)</option>
                <option value="kotlin">Kotlin (1.3)</option>
            </select>

            <button class="btn-action" onclick="adjustFontSize(1)"><i class="fa-solid fa-plus"></i></button>
            <button class="btn-action" onclick="adjustFontSize(-1)"><i class="fa-solid fa-minus"></i></button>
            <button class="btn-action" onclick="copySourceCode()"><i class="fa-regular fa-copy"></i></button>

            <!-- Run Button -->
            <button id="runBtn" class="btn-run" onclick="executeProgram()">
                <i class="fa-solid fa-play"></i> Run Code
            </button>
        </div>
    </header>

    <!-- 1. TOP BANNER AD (320x50 Adsterra) -->
    <div id="top-ad-zone">
        <script type="text/javascript">
            atOptions = {
                'key' : 'e2fb0481067ecb77e9c1a9e148e65c71',
                'format' : 'iframe',
                'height' : 50,
                'width' : 320,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://www.highrevenueformat.com/e2fb0481067ecb77e9c1a9e148e65c71/invoke.js"></script>
    </div>

    <!-- Main Workspace -->
    <div class="workspace">
        <div class="editor-header">
            <span id="currentLangTitle">PYTHON 3 RUNTIME</span>
            <span class="badge-pill">VS Code Engine</span>
        </div>
        <div id="editor"></div>

        <div class="stdin-drawer">
            <span style="font-size: 0.8rem; color: #94a3b8;"><i class="fa-solid fa-keyboard"></i> STDIN Input:</span>
            <input type="text" id="stdinInput" placeholder="If program needs input, type here...">
        </div>
    </div>

    <!-- 2. FULLSCREEN OUTPUT TERMINAL SCREEN -->
    <div id="outputOverlay">
        <div class="overlay-header">
            <div class="overlay-title">
                <i class="fa-solid fa-terminal" style="color: #10b981;"></i> Execution Console & Terminal
            </div>
            <div>
                <button class="btn-action" onclick="copyConsoleOutput()"><i class="fa-regular fa-copy"></i> Copy Output</button>
                <button class="btn-close-terminal" onclick="closeTerminal()"><i class="fa-solid fa-xmark"></i> Back to Code</button>
            </div>
        </div>

        <!-- 3. NATIVE BANNER AD (RUN SCREEN) -->
        <div class="overlay-ad-slot">
            <script async="async" data-cfasync="false" src="https://pl20790894.profitableratecpmnetwork.com/aa092d5a405faa2160549129cab4e19a/invoke.js"></script>
            <div id="container-aa092d5a405faa2160549129cab4e19a"></div>
        </div>

        <pre id="terminalOutput" class="terminal-body">Compiling and executing code...</pre>

        <div class="terminal-status-bar">
            <span id="terminalStatusMsg">Status: Initializing...</span>
            <span>Execution Time: <span id="execDuration">0.0s</span></span>
        </div>
    </div>

    <!-- 4. SOCIAL BAR AD (Adsterra) -->
    <script src="https://pl20790893.profitableratecpmnetwork.com/e0/d9/e1/e0d9e140d2a95360f9f664cd9cdffcc54.js"></script>

    <!-- Logic Script -->
    <script>
        const languages = {
            python: { id: 71, mode: "ace/mode/python", code: `# Python 3 Online Demo\nprint("Hello World!")\nfor i in range(1, 6):\n    print(f"Step {i}: Success!")\n` },
            cpp: { id: 54, mode: "ace/mode/c_cpp", code: `#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "C++ Compiler Output Ready!" << endl;\n    return 0;\n}\n` },
            c: { id: 50, mode: "ace/mode/c_cpp", code: `#include <stdio.h>\n\nint main() {\n    printf("Standard C System Output!\\n");\n    return 0;\n}\n` },
            java: { id: 62, mode: "ace/mode/java", code: `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Java Environment Active!");\n    }\n}\n` },
            javascript: { id: 63, mode: "ace/mode/javascript", code: `console.log("JavaScript Execution Finished!");\n` },
            csharp: { id: 51, mode: "ace/mode/csharp", code: `using System;\nclass MainClass {\n    static void Main() {\n        Console.WriteLine("C# Active!");\n    }\n}\n` },
            go: { id: 60, mode: "ace/mode/golang", code: `package main\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Go Runtime Active!");\n}\n` },
            rust: { id: 73, mode: "ace/mode/rust", code: `fn main() {\n    println!("Rust Active!");\n}\n` },
            php: { id: 68, mode: "ace/mode/php", code: `<?php echo "PHP Active!\\n"; ?>\n` },
            kotlin: { id: 78, mode: "ace/mode/kotlin", code: `fun main() {\n    println("Kotlin Active!");\n}\n` }
        };

        const editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/python");
        editor.setValue(languages.python.code, 1);
        editor.setShowPrintMargin(false);

        const langSelect = document.getElementById("langSelect");
        const currentLangTitle = document.getElementById("currentLangTitle");
        const outputOverlay = document.getElementById("outputOverlay");
        const terminalOutput = document.getElementById("terminalOutput");
        const terminalStatusMsg = document.getElementById("terminalStatusMsg");
        const execDuration = document.getElementById("execDuration");

        langSelect.addEventListener("change", () => {
            const lang = languages[langSelect.value];
            if (lang) {
                editor.session.setMode(lang.mode);
                editor.setValue(lang.code, 1);
                currentLangTitle.innerText = langSelect.options[langSelect.selectedIndex].text.toUpperCase();
            }
        });

        let currentFontSize = 14.5;
        function adjustFontSize(delta) {
            currentFontSize = Math.max(11, Math.min(24, currentFontSize + delta));
            editor.setFontSize(currentFontSize + "px");
        }

        function copySourceCode() {
            navigator.clipboard.writeText(editor.getValue());
            alert("Code copied!");
        }

        function copyConsoleOutput() {
            navigator.clipboard.writeText(terminalOutput.innerText);
            alert("Output copied!");
        }

        function closeTerminal() {
            outputOverlay.style.display = "none";
        }

        async function executeProgram() {
            const currentLang = languages[langSelect.value];
            const code = editor.getValue();
            const stdin = document.getElementById("stdinInput").value;

            outputOverlay.style.display = "flex";
            terminalOutput.style.color = "#38bdf8";
            terminalOutput.innerText = "Connecting to compiler cluster...\nCompiling code and fetching output...\n";
            terminalStatusMsg.innerHTML = '<span style="color:#eab308;">Status: Running...</span>';
            execDuration.innerText = "Measuring...";

            const startTime = performance.now();

            try {
                const res = await fetch("https://ce.judge0.com/submissions?base64_encoded=false&wait=true", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        language_id: currentLang.id,
                        source_code: code,
                        stdin: stdin
                    })
                });

                const data = await res.json();
                const totalTime = ((performance.now() - startTime) / 1000).toFixed(2);
                execDuration.innerText = totalTime + "s";

                if (data.stdout) {
                    terminalOutput.style.color = "#38bdf8";
                    terminalOutput.innerText = data.stdout;
                    terminalStatusMsg.innerHTML = '<span class="status-badge-ok">Process Finished (Success)</span>';
                } else if (data.stderr) {
                    terminalOutput.style.color = "#f87171";
                    terminalOutput.innerText = data.stderr;
                    terminalStatusMsg.innerHTML = '<span class="status-badge-err">Runtime Error</span>';
                } else if (data.compile_output) {
                    terminalOutput.style.color = "#f87171";
                    terminalOutput.innerText = data.compile_output;
                    terminalStatusMsg.innerHTML = '<span class="status-badge-err">Compilation Failed</span>';
                } else {
                    terminalOutput.innerText = data.status ? data.status.description : "Finished";
                    terminalStatusMsg.innerHTML = '<span class="status-badge-ok">Execution Complete</span>';
                }
            } catch (err) {
                terminalOutput.style.color = "#f87171";
                terminalOutput.innerText = "Network Error: " + err.message;
                terminalStatusMsg.innerHTML = '<span class="status-badge-err">Connection Error</span>';
            }
        }
    </script>
</body>
</html>
