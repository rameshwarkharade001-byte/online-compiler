<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeForge Studio - Online Compiler</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ace.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.7/ext-language_tools.js"></script>

    <style>
        :root {
            --bg-body: #06080e;
            --bg-card: #0d111c;
            --border: #1e2638;
            --primary: #6366f1;
            --run-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --text-main: #f8fafc;
            --text-muted: #8492a6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: rgba(13, 17, 28, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 800;
        }

        .brand i {
            color: #818cf8;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        select {
            background: #141a29;
            color: #fff;
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
        }

        .btn-action {
            background: #141a29;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 6px 9px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .btn-run {
            background: var(--run-gradient);
            color: white;
            border: none;
            padding: 7px 16px;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.88rem;
        }

        #top-ad-zone {
            background: #090c14;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            border-bottom: 1px solid var(--border);
        }

        .workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .editor-header {
            background: #0b0f19;
            padding: 6px 14px;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #editor {
            flex: 1;
            width: 100%;
            height: 100%;
            font-family: 'Fira Code', monospace;
            font-size: 14.5px;
        }

        .stdin-drawer {
            background: #0b0f19;
            border-top: 1px solid var(--border);
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stdin-drawer input {
            flex: 1;
            background: #141a29;
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            color: #fff;
            font-family: 'Fira Code', monospace;
            font-size: 12px;
            outline: none;
        }

        /* ===== COMPLETELY SAFE FULLSCREEN TERMINAL ===== */
        #outputOverlay {
            position: fixed;
            inset: 0;
            background: #04060a;
            z-index: 2147483640;
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .terminal-top-bar {
            background: #0d121f;
            border-bottom: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .terminal-scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            padding-bottom: 90px; /* जागा रिकामी ठेवली बटनासाठी */
        }

        .terminal-box {
            background: #0a0d14;
            border: 1px solid #1e2638;
            border-radius: 8px;
            padding: 12px;
        }

        .terminal-title {
            color: #10b981;
            font-size: 0.8rem;
            font-weight: 700;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        #terminalOutput {
            font-family: 'Fira Code', monospace;
            font-size: 13.5px;
            line-height: 1.5;
            color: #38bdf8;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .ad-container-box {
            background: #07090f;
            border: 1px dashed #242c40;
            border-radius: 8px;
            padding: 6px;
            text-align: center;
            overflow: hidden;
        }

        /* FLOATING FOOTER CLOSE BUTTON - NEVER GETS OVERLAPPED */
        .floating-footer-action {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(13, 18, 31, 0.98);
            backdrop-filter: blur(10px);
            border-top: 2px solid #ef4444;
            padding: 12px 16px;
            display: flex;
            justify-content: center;
            z-index: 2147483647 !important;
            box-shadow: 0 -6px 20px rgba(0,0,0,0.8);
        }

        .btn-giant-close {
            background: #ef4444;
            color: #fff;
            border: none;
            width: 100%;
            max-width: 400px;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            letter-spacing: 0.03em;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <i class="fa-solid fa-code"></i> CodeForge Studio
        </div>

        <div class="nav-actions">
            <select id="langSelect">
                <option value="python">Python 3</option>
                <option value="cpp">C++ (GCC)</option>
                <option value="c">C (GCC)</option>
                <option value="java">Java 13</option>
                <option value="javascript">JavaScript</option>
                <option value="csharp">C#</option>
                <option value="go">Go</option>
                <option value="rust">Rust</option>
                <option value="php">PHP</option>
                <option value="kotlin">Kotlin</option>
            </select>

            <button class="btn-action" onclick="adjustFontSize(1)"><i class="fa-solid fa-plus"></i></button>
            <button class="btn-action" onclick="adjustFontSize(-1)"><i class="fa-solid fa-minus"></i></button>

            <button id="runBtn" class="btn-run" onclick="executeProgram()">
                <i class="fa-solid fa-play"></i> Run Code
            </button>
        </div>
    </header>

    <!-- Top Banner Ad (320x50) -->
    <div id="top-ad-zone">
        <script type="text/javascript">
            atOptions = {
                'key' : 'e2fb0481067ecb77e9c1a9e148e65c71',
                'format' : 'iframe',
                'height' : 50,
                'width' : 320,
                'params' : {}
            };
        </script>
        <script type="text/javascript" src="https://www.highrevenueformat.com/e2fb0481067ecb77e9c1a9e148e65c71/invoke.js"></script>
    </div>

    <!-- Workspace -->
    <div class="workspace">
        <div class="editor-header">
            <span id="currentLangTitle">PYTHON 3 RUNTIME</span>
            <span style="color:#818cf8; font-size:11px;">VS Code Engine</span>
        </div>
        <div id="editor"></div>

        <div class="stdin-drawer">
            <span style="font-size: 0.8rem; color: #94a3b8;"><i class="fa-solid fa-keyboard"></i> STDIN:</span>
            <input type="text" id="stdinInput" placeholder="Input if required...">
        </div>
    </div>

    <!-- FULLSCREEN OUTPUT TERMINAL OVERLAY -->
    <div id="outputOverlay">
        <div class="terminal-top-bar">
            <span><i class="fa-solid fa-terminal" style="color: #10b981;"></i> Output Result</span>
            <span id="execDuration" style="font-size:12px; color:#94a3b8;">0.0s</span>
        </div>

        <div class="terminal-scroll-area">
            <!-- 1. Real Output Text -->
            <div class="terminal-box">
                <div class="terminal-title">Console Output:</div>
                <pre id="terminalOutput">Compiling...</pre>
            </div>

            <!-- 2. Native Banner Ad inside controlled box -->
            <div class="ad-container-box">
                <div style="font-size: 10px; color: #64748b; margin-bottom: 4px;">SPONSORED</div>
                <script async="async" data-cfasync="false" src="https://pl20790894.profitableratecpmnetwork.com/aa092d5a405faa2160549129cab4e19a/invoke.js"></script>
                <div id="container-aa092d5a405faa2160549129cab4e19a"></div>
            </div>
        </div>

        <!-- 3. ALWAYS-ON-TOP CLOSE BUTTON AT BOTTOM -->
        <div class="floating-footer-action">
            <button class="btn-giant-close" onclick="closeTerminal()">
                <i class="fa-solid fa-arrow-left"></i> BACK TO CODE EDITOR
            </button>
        </div>
    </div>

    <!-- Social Bar Ad -->
    <script src="https://pl20790893.profitableratecpmnetwork.com/e0/d9/e1/e0d9e140d2a95360f9f664cd9cdffcc54.js"></script>

    <script>
        const languages = {
            python: { id: 71, mode: "ace/mode/python", code: `# Python 3 Online Demo\nprint("Hello World!")\nfor i in range(1, 6):\n    print(f"Step {i}: Success!")\n` },
            cpp: { id: 54, mode: "ace/mode/c_cpp", code: `#include <iostream>\nusing namespace std;\n\nint main() {\n    cout << "C++ Output Ready!" << endl;\n    return 0;\n}\n` },
            c: { id: 50, mode: "ace/mode/c_cpp", code: `#include <stdio.h>\n\nint main() {\n    printf("Standard C Output!\\n");\n    return 0;\n}\n` },
            java: { id: 62, mode: "ace/mode/java", code: `public class Main {\n    public static void main(String[] args) {\n        System.out.println("Java Environment Active!");\n    }\n}\n` },
            javascript: { id: 63, mode: "ace/mode/javascript", code: `console.log("JavaScript Execution Finished!");\n` },
            csharp: { id: 51, mode: "ace/mode/csharp", code: `using System;\nclass MainClass {\n    static void Main() {\n        Console.WriteLine("C# Active!");\n    }\n}\n` },
            go: { id: 60, mode: "ace/mode/golang", code: `package main\nimport "fmt"\n\nfunc main() {\n    fmt.Println("Go Runtime Active!");\n}\n` },
            rust: { id: 73, mode: "ace/mode/rust", code: `fn main() {\n    println!("Rust Active!");\n}\n` },
            php: { id: 68, mode: "ace/mode/php", code: `<?php echo "PHP Active!\\n"; ?>\n` },
            kotlin: { id: 78, mode: "ace/mode/kotlin", code: `fun main() {\n    println("Kotlin Active!");\n}\n` }
        };

        const editor = ace.edit("editor");
        editor.setTheme("ace/theme/tomorrow_night_eighties");
        editor.session.setMode("ace/mode/python");
        editor.setValue(languages.python.code, 1);
        editor.setShowPrintMargin(false);

        const langSelect = document.getElementById("langSelect");
        const currentLangTitle = document.getElementById("currentLangTitle");
        const outputOverlay = document.getElementById("outputOverlay");
        const terminalOutput = document.getElementById("terminalOutput");
        const execDuration = document.getElementById("execDuration");

        langSelect.addEventListener("change", () => {
            const lang = languages[langSelect.value];
            if (lang) {
                editor.session.setMode(lang.mode);
                editor.setValue(lang.code, 1);
                currentLangTitle.innerText = langSelect.options[langSelect.selectedIndex].text.toUpperCase();
            }
        });

        let currentFontSize = 14.5;
        function adjustFontSize(delta) {
            currentFontSize = Math.max(11, Math.min(24, currentFontSize + delta));
            editor.setFontSize(currentFontSize + "px");
        }

        function closeTerminal() {
            outputOverlay.style.display = "none";
        }

        async function executeProgram() {
            const currentLang = languages[langSelect.value];
            const code = editor.getValue();
            const stdin = document.getElementById("stdinInput").value;

            outputOverlay.style.display = "flex";
            terminalOutput.style.color = "#38bdf8";
            terminalOutput.innerText = "Running code on server cluster...";
            execDuration.innerText = "Executing...";

            const startTime = performance.now();

            try {
                const res = await fetch("https://ce.judge0.com/submissions?base64_encoded=false&wait=true", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        language_id: currentLang.id,
                        source_code: code,
                        stdin: stdin
                    })
                });

                const data = await res.json();
                const totalTime = ((performance.now() - startTime) / 1000).toFixed(2);
                execDuration.innerText = totalTime + "s";

                if (data.stdout) {
                    terminalOutput.style.color = "#38bdf8";
                    terminalOutput.innerText = data.stdout;
                } else if (data.stderr) {
                    terminalOutput.style.color = "#f87171";
                    terminalOutput.innerText = data.stderr;
                } else if (data.compile_output) {
                    terminalOutput.style.color = "#f87171";
                    terminalOutput.innerText = data.compile_output;
                } else {
                    terminalOutput.innerText = data.status ? data.status.description : "Completed";
                }
            } catch (err) {
                terminalOutput.style.color = "#f87171";
                terminalOutput.innerText = "Execution failed: " + err.message;
            }
        }
    </script>
</body>
</html>
